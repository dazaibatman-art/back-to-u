{% extends "base.html" %}
{% block title %}500 — Server Error | Group No1{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 4rem auto; text-align: center; background: white; padding: 3rem 2rem; border-radius: 20px; box-shadow: var(--shadow-elevated);">
    <div style="font-size: 3.5rem; margin-bottom: 0.5rem;">⚙️</div>
    <h1 style="color: #667eea; font-size: 2.2rem; margin-bottom: 0.5rem;">500 — Internal Server Error</h1>
    <p style="color: #64748b; font-size: 1rem; margin-bottom: 2rem;">

    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
</div>
{% endblock %}
