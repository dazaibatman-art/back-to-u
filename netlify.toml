[build]
  command = "pip install -r requirements.txt"
  functions = "netlify/functions"
  publish = "group-no1/app/static"

[build.environment]
  PYTHON_VERSION = "3.11"

[functions]
  included_files = ["group-no1/**"]

# Static assets served directly; everything else routes to Flask function
[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
  force = true
